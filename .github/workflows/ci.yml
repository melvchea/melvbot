name: CI

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telegram-container:
    name: telegram-container ts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: telegram-container/ts
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: telegram-container/ts/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Test
        run: npm run test:coverage

  secret-guard:
    name: secret-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
      GUARD_TERMS: ${{ secrets.GUARD_TERMS }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Guard (IPv4, email, private names)
        run: host-cli/libexec/guard

      - name: Gitleaks (full history)
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tar_name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tar_name}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tar_name}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tar_name}" gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  notify-commit:
    name: notify-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [telegram-container, secret-guard]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.telegram-container.result == 'success' && needs.secret-guard.result == 'success' }}
    env:
      REPO: ${{ github.repository }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COMMITS: ${{ toJSON(github.event.commits) }}
    steps:
      - name: Send Telegram notification
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: |
          set -eu
          lines="$(printf '%s' "$COMMITS" | jq -r '.[] | select(.message | startswith("Sync ") | not) | "\(.id[0:7]) \(.message | split("\n")[0])"')"
          [ -n "$lines" ] || exit 0
          text="$(printf '%s\n%s' "$REPO" "$lines" | head -c 3500)"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null

  notify-failure:
    name: notify-failure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [telegram-container, secret-guard]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Send Telegram failure
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: |
          set -eu
          when="$(TZ=Asia/Singapore date '+%a %-d %b %H:%M')"
          text="$(printf 'CI Failed %s\n\n%s\n%s' "$when" "${SHA:0:7}" "$RUN_URL")"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null
