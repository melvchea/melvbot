name: CI

on:
  push:
    branches:
      - "main"
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: container ts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: container/ts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: container/ts/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Typecheck
        run: npm run build

      - name: Test
        run: npm run test:coverage

  secret-guard:
    name: secret-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.28.0"
      GUARD_TERMS: ${{ secrets.GUARD_TERMS }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard (IPv4, email, private names)
        run: host/libexec/guard

      - name: Gitleaks (full history)
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tar_name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tar_name}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tar_name}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tar_name}" gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Zizmor
        run: pipx run zizmor==1.30.1 --offline .github/workflows

  code-scanning:
    name: code-scanning alerts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for CodeQL of this commit (push only)
        if: github.event_name == 'push'
        run: |
          for _ in $(seq 40); do
            s=$(gh run list --workflow CodeQL --commit "$SHA" --json status --jq '.[0].status // "none"')
            [ "$s" = completed ] && break
            sleep 10
          done

      - name: Open alerts must be zero
        run: host/bin/dalerts

  shell-docker-lint:
    name: shellcheck + hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: git ls-files -z '*.sh' 'host/bin/*' 'host/libexec/*' | xargs -0 grep -lZ '^#!.*sh' | xargs -0 shellcheck --severity=warning

      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning --ignore DL3008 - < container/Dockerfile.node

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
